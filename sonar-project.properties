###############################################################################
# sonar-project.properties
#
# READ THIS FIRST (demo talking points):
#
#   * This file MUST live at the repository ROOT. The scanner only reads it
#     from the root - a copy in a subdirectory is silently ignored.
#   * It is for the SonarScanner CLI family, which includes the
#     SonarSource/sonarqube-scan-action@v6 GitHub Action we use in CI.
#     Maven/Gradle projects configure Sonar in pom.xml / build.gradle instead.
#   * Python needs NO compilation step, which makes it the easiest language to
#     demo: point at sources, point at reports, scan. (Compare with Java,
#     which fails without compiled bytecode.)
#   * Secrets are NEVER in this file. SONAR_TOKEN lives in GitHub Actions
#     secrets. SonarQube Cloud's URL is the scanner's default, so we do not
#     set sonar.host.url at all.
#   * Anything here can be overridden on the command line with -Dkey=value,
#     which is handy for a live "what if" during the session.
###############################################################################

# --- Identity -----------------------------------------------------------------
# Organization key from SonarQube Cloud. Find it at:
#   sonarcloud.io -> your avatar -> My Organizations -> the slug in the URL.
# REQUIRED for SonarQube Cloud. Omit it entirely for a self-hosted server.
sonar.organization=itmethods-inc

# Project key must be unique inside the organization and must MATCH the key
# that SonarQube Cloud created when the repo was imported. A mismatch is the
# most common cause of "project not found" during the first scan.
#
# GOTCHA WE HIT LIVE - worth showing people:
# On a GitHub import, SonarQube Cloud generates the key from the GITHUB OWNER,
# not from the Sonar organization. So the key is:
#
#     vinod-itmethods_sonar-python-workshop      <- GitHub account prefix
# NOT itmethods-inc_sonar-python-workshop        <- Sonar org prefix (wrong)
#
# Guessing this wrong produces exactly this error, which reads like a
# permissions problem but isn't:
#
#   ERROR The project <key> doesn't exist and can't be created. Please check
#   the sonar.organizationKey and sonar.projectKey parameters, the permissions
#   associated with your token, or create the project on the SonarQube Cloud UI.
#
# Always copy the key from the Sonar UI rather than constructing it by hand.
sonar.projectKey=vinod-itmethods_sonar-python-workshop

# Display name in the SonarQube UI. Cosmetic only.
sonar.projectName=Sonar Python Workshop

# --- TEMPORARY TEST: sonar.branch.name ----------------------------------------
# Being evaluated for the standard properties template. Remove after testing.
sonar.branch.name=dev

# Optional. Useful if you want release-over-release comparison in the UI.
# Leave commented so every scan lands on the same project version.
# sonar.projectVersion=0.1.0


# --- Sources & tests ----------------------------------------------------------
# Production code. Paths are relative to this file.
sonar.sources=src

# Test code. Listing tests separately matters: Sonar applies a DIFFERENT,
# test-specific rule set here, and it excludes tests from the coverage
# denominator. If you dump tests into sonar.sources you get wrong metrics.
sonar.tests=tests

# Always pin the encoding. Without it the scanner guesses from the JVM locale,
# which makes results differ between a developer laptop and the CI runner.
sonar.sourceEncoding=UTF-8

# Tell the analyzer which Python version to assume. This changes which rules
# fire (e.g. f-strings, walrus, match statements, PEP 604 unions).
sonar.python.version=3.11, 3.12, 3.13


# --- Coverage & test reports (the part everyone gets wrong) -------------------
# IMPORTANT: SonarQube does NOT run your tests and does NOT measure coverage
# itself. pytest + pytest-cov produce the reports; the scanner only IMPORTS
# them. So the CI order is mandatory:
#
#       1. pytest (writes coverage.xml + junit.xml)
#       2. sonar scan (reads them)
#
# If the scan runs first, or the tests fail before writing reports, you get
# "0.0% Coverage" and a very confused audience.

# Cobertura-format coverage XML, produced by `pytest --cov --cov-report=xml`.
# Comma-separate multiple files for a monorepo.
sonar.python.coverage.reportPaths=coverage.xml

# JUnit-format test execution XML, produced by `pytest --junitxml=junit.xml`.
# This is what populates the test COUNT and DURATION widgets. It is separate
# from coverage - you need both files for the full picture.
sonar.python.xunit.reportPath=junit.xml

# DEMO TOGGLE: uncomment this to make the scanner ignore the coverage report
# entirely, re-run, and show the Coverage metric collapse to 0%. Good way to
# prove the reports are doing real work.
# sonar.python.coverage.reportPaths=


# --- Exclusions: keep code OUT of analysis ------------------------------------
# sonar.exclusions removes files from analysis COMPLETELY - no issues, no
# duplication, no metrics. Use it for code you did not write and cannot fix:
# generated clients, protobuf stubs, vendored third-party code, migrations.
#
# DEMO TOGGLE: comment the next line out, re-scan, and watch the issue count
# jump as src/invoice/generated/models_pb2.py floods in. Then restore it.
sonar.exclusions=**/generated/**,**/migrations/**,**/*_pb2.py,**/node_modules/**


# --- Coverage inclusions/exclusions: keep code OUT of the COVERAGE % ----------
# Different job from sonar.exclusions. These files are STILL analysed for bugs
# and vulnerabilities - they just stop counting against the coverage ratio.
# Use it for code that is genuinely not worth unit-testing: __init__ shims,
# dataclass-only modules, CLI entrypoints, settings files.
sonar.coverage.exclusions=**/__init__.py,**/conftest.py,**/generated/**,**/*_pb2.py

# The positive form. When sonar.inclusions is set, ONLY these patterns are
# analysed and everything else is skipped - it is a whitelist, and it OVERRIDES
# the broader sonar.sources setting. Powerful for carving one team's code out
# of a monorepo, and easy to misuse.
#
# DEMO TOGGLE: uncomment to narrow analysis down to the discounts module only.
# Re-scan and show that auth.py's vulnerabilities vanish from the report -
# a great cautionary tale about over-scoping inclusions.
# sonar.inclusions=src/invoice/discounts.py

# Duplication has its own exclusion knob. Test files legitimately repeat
# boilerplate, so excluding them keeps the duplication metric honest.
# Leave this COMMENTED for the demo so legacy_report.py's copy-paste shows up.
# sonar.cpd.exclusions=**/tests/**,**/*_pb2.py


# --- Analysis scope niceties --------------------------------------------------
# Skip binaries and large fixtures the scanner would otherwise try to read.
# sonar.scm.exclusions.disabled=false   # keep .gitignore-aware skipping ON

# The scanner reads git blame to attribute NEW CODE to authors and dates.
# This is what makes "Clean as You Code" and PR decoration work, so the CI
# checkout MUST use fetch-depth: 0 (see .github/workflows/ci.yml).
# Disabling SCM breaks new-code detection - do not do this:
# sonar.scm.disabled=true

# Verbose scanner logging. Uncomment when a scan misbehaves live; it prints
# every resolved path and every report it did or did not find.
# sonar.verbose=true
